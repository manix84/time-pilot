name: Dry Run Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Dry Run Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry run build
        run: npm run build
        env:
          VITE_BASE_PATH: /time-pilot/
