name: Release Current Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Release Current Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: |
          npm test
          npm run lint
          npm run typecheck

      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build downloadable release
        env:
          VITE_APP_MODE: pwa
          VITE_API_MODE: offline
          VITE_BASE_PATH: ./
          VITE_SERVICE_WORKER: disabled
        run: npm run build

      - name: Package downloadable release
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          archive="time-pilot-v${VERSION}-web.zip"

          rm -rf release-assets release-package
          mkdir -p release-assets release-package

          mkdir -p release-package/assets
          cp dist/assets/app.css release-package/assets/
          cp dist/assets/main.js release-package/assets/
          cp -R dist/fonts release-package/fonts
          cp -R dist/logos release-package/logos
          cp -R dist/music release-package/music
          cp -R dist/sounds release-package/sounds
          cp -R dist/sprites release-package/sprites
          sed 's#\.\./#./#g' dist/pwa/index.html \
            | grep -v 'rel="manifest"' \
            | grep -v 'rel="icon"' \
            | grep -v 'rel="apple-touch-icon"' \
            > release-package/index.html

          cat > dist/README.txt <<EOF
          Time Pilot v${VERSION}

          This archive contains the built web version of Time Pilot.

          To play locally, extract the archive, serve the extracted directory
          with any static web server, then open the local URL in your browser.

          Choose one static-server command:

          Option 1, with npm:
            npx serve .

          Option 2, with Python:
            python3 -m http.server 8080

          Opening index.html directly from the file system is not recommended
          because browser security rules can block module and asset loading.
          EOF
          mv dist/README.txt release-package/README.txt

          cd release-package
          zip -r "../release-assets/${archive}" .

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists. Skipping release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}"
          git push origin "${tag}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
          else
            gh release create "${tag}" \
              "release-assets/time-pilot-v${VERSION}-web.zip" \
              --title "Time Pilot ${tag}" \
              --notes "Release ${tag} from ${GITHUB_SHA}.

          Download \`time-pilot-v${VERSION}-web.zip\`, extract it, serve the extracted directory with a local static web server, and open the local URL in your browser."
          fi
